[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vera-research"
version = "0.1.0"
description = "Central rental research MCP module for Vera Imobiliária"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vera_research"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
